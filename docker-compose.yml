# Production : tout passe par Caddy (HTTPS). Seuls les ports 80/443 sont publiés.
#   docker compose up -d --build
#   docker compose up -d --scale worker=3          # plusieurs workers d'ingestion
#   docker compose --profile monitoring up -d       # + Prometheus et Grafana
x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    DATA_DIR: /data
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    QUEUE_BACKEND: celery
    CHROMA_HOST: chroma
    CHROMA_PORT: "8000"
    FORWARDED_ALLOW_IPS: "*"   # l'API n'est joignable que via Caddy : on lui fait confiance pour X-Forwarded-For
  volumes:
    - appdata:/data   # uploads, texte extrait, caches de modèles (partagé API <-> workers)

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificats : à conserver (limites de Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO",
              "--concurrency=${WORKER_CONCURRENCY:-1}"]
    healthcheck:   # remplace celui de l'image (qui interroge le port 8000 de l'API)
      test: ["CMD-SHELL", "curl -fsS http://localhost:9101/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      api:
        condition: service_healthy   # les migrations Alembic tournent au démarrage de l'API
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Pas de port publié : la base n'est accessible que depuis le réseau Docker.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data

  chroma:   # base vectorielle partagée par l'API et les workers (le mode embarqué est mono-process)
    image: chromadb/chroma:0.5.15   # même version que le client (requirements.txt)
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/chroma/chroma
    # Pas de port publié, pas d'authentification : réseau Docker interne uniquement.

  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_INCLUDE_VECTORS: ${BACKUP_INCLUDE_VECTORS:-false}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - appdata:/data:ro
      - chromadata:/chroma:ro
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # local uniquement

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # local uniquement (tunnel SSH ou ajoutez un bloc dans le Caddyfile)
    depends_on:
      - prometheus

volumes:
  pgdata:
  appdata:
  chromadata:
  redisdata:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
